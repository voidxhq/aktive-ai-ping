name: Keep Backend Alive

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
    - cron: '0 0 * * 0'    # Runs every Sunday midnight for DB cleanup
  workflow_dispatch: # Allows manual triggers

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive Commit
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          if [ "$DIFF_DAYS" -gt 50 ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m "chore: keepalive dummy commit"
            git push
          else
            echo "Last commit was $DIFF_DAYS days ago. No keepalive commit needed."
          fi

  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        continue-on-error: true
        # Dropped -f so 503s don't crash curl, added --retry-all-errors for stability
        run: |
          curl -sS --retry 5 --retry-delay 10 --retry-all-errors \
            https://voidx102-aktive-ai.hf.space/health > /dev/null

  cleanup:
    runs-on: ubuntu-latest
    # This ensures it ONLY runs on the Sunday cron or if you trigger it manually
    if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Cleanup Old Sessions
        run: |
          curl -X POST 'https://dupvdrvocdhimnfcsvpu.supabase.co/rest/v1/rpc/delete_old_sessions' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

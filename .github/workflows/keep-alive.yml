name: Keep Backend Alive

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
    - cron: '0 0 * * 0'    # Runs every Sunday midnight for DB cleanup
  workflow_dispatch: # Allows manual triggers

jobs:
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keepalive Step
        run: |
          # Fetch keepalive branch if it exists remotely
          git fetch origin keepalive:keepalive 2>/dev/null || true

          MAIN_DATE=$(git log -1 --format=%ct origin/main 2>/dev/null || git log -1 --format=%ct)
          KEEPALIVE_DATE=$(git log -1 --format=%ct keepalive 2>/dev/null || echo 0)

          if [ "$KEEPALIVE_DATE" -gt "$MAIN_DATE" ]; then
            LATEST_DATE=$KEEPALIVE_DATE
          else
            LATEST_DATE=$MAIN_DATE
          fi

          CURRENT_DATE=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_DATE - LATEST_DATE) / 86400 ))
          echo "Days since last repository commit: $DIFF_DAYS"

          if [ "$DIFF_DAYS" -gt 50 ]; then
            echo "Repository has been inactive for $DIFF_DAYS days (> 50). Performing keepalive..."
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            
            # Use dedicated keepalive branch to avoid branch protection rules on main
            git checkout -B keepalive
            git commit --allow-empty -m "chore: keepalive dummy commit [skip ci]"
            git push origin keepalive --force || true

            # Also ensure workflow state remains active via GitHub Actions API
            curl -s -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable" || true
            echo "Keepalive completed successfully."
          else
            echo "Last commit was $DIFF_DAYS days ago. No keepalive commit needed."
          fi

  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        continue-on-error: true
        # Dropped -f so 503s don't crash curl, added --retry-all-errors for stability
        run: |
          curl -sS --retry 5 --retry-delay 10 --retry-all-errors \
            https://voidx102-aktive-ai.hf.space/health > /dev/null

  cleanup:
    runs-on: ubuntu-latest
    # This ensures it ONLY runs on the Sunday cron or if you trigger it manually
    if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Cleanup Old Sessions
        run: |
          curl -X POST 'https://dupvdrvocdhimnfcsvpu.supabase.co/rest/v1/rpc/delete_old_sessions' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
